# Production edge proxy for the API.
# Terminate TLS at this server or at the load balancer in front of it.
# Keep the values below aligned with MAX_REQUEST_BODY_BYTES,
# RATE_LIMIT_MAX_REQUESTS, RATE_LIMIT_WINDOW_MS, and LLM_TIMEOUT_MS.

events {}

http {
  limit_req_zone $binary_remote_addr zone=review_api:10m rate=10r/m;
  limit_req_status 429;

  upstream smart_code_reviewer_api {
    server 127.0.0.1:3000;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      proxy_pass http://smart_code_reviewer_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/review {
      client_max_body_size 25000;
      client_body_timeout 10s;
      limit_req zone=review_api burst=2 nodelay;
      limit_except POST OPTIONS { deny all; }

      proxy_pass http://smart_code_reviewer_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering on;
      proxy_connect_timeout 5s;
      proxy_send_timeout 35s;
      proxy_read_timeout 35s;
    }

    location / {
      return 404;
    }
  }
}
